    <!-- Link previews (WhatsApp, Facebook, LinkedIn, Slack, Telegram...): the image is public/og-image.jpg, 1200x630.
         %SITE_URL% is filled in at build time from src/data/siteUrl.js; the image address must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nuwarinda Albert" />
    <meta property="og:title" content="Nuwarinda Albert | Computer Scientist • Software Developer" />
    <meta property="og:description" content="Portfolio of Nuwarinda Albert, a computer scientist and software developer in Kampala, Uganda: projects, skills, experience and how to get in touch." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nuwarinda Albert, computer scientist and software developer, in Kampala, Uganda" />
    <meta property="og:locale" content="en_US" />

    <!-- X (Twitter) -->

    <meta name="twitter:title" content="Nuwarinda Albert | Computer Scientist • Software Developer" />

    <!-- Structured data for search engines. Keep "sameAs" in step with the social links in src/data/site.js. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "Nuwarinda Albert",
            "description": "Portfolio of Nuwarinda Albert, a computer scientist and software developer in Kampala, Uganda: projects, skills, experience and how to get in touch.",
            "inLanguage": "en",
            "publisher": { "@id": "%SITE_URL%/#person" }
          },
          {
            "@type": "Person",
            "@id": "%SITE_URL%/#person",
            "name": "Nuwarinda Albert",
            "url": "%SITE_URL%/",
            "image": "%SITE_URL%/og-image.jpg",
            "jobTitle": "Software Developer",
            "description": "Computer scientist and software developer building full-stack, mobile and AI-powered software.",
            "address": { "@type": "PostalAddress", "addressLocality": "Kampala", "addressCountry": "UG" },
            "sameAs": [
              "https://github.com/Alberto-G1",
              "https://www.linkedin.com/in/albert-nuwarinda-129841351/"
            ],
            "knowsAbout": [
              "Software development",
              "Full-stack web development",
              "Mobile app development",
              "Machine learning",
              "System design"
            ]
          }
        ]
      }
    </script>

    <!-- Applies the saved theme before first paint so there is no flash.
         Mirrors src/context/themeConfig.js (read + apply logic); keep in step. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var saved = {};
          try {
            saved = JSON.parse(localStorage.getItem('portfolio-theme')) || {};
          } catch (e) {}

          // Anything other than an explicit light/dark means "system".
          var dark =
            saved.mode === 'dark' ||
            (saved.mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var key = dark ? 'dark' : 'light';
          root.setAttribute('data-theme', key);

          var custom = (saved.overrides && saved.overrides[key]) || {};
          var hex = /^#[0-9a-f]{6}$/i;
          ['accent', 'heading', 'hover'].forEach(function (name) {
            if (typeof custom[name] === 'string' && hex.test(custom[name])) {
              root.style.setProperty('--' + name, custom[name]);
            }
          });

          // --accent-contrast: white or navy, whichever reads better on the accent.
          if (typeof custom.accent === 'string' && hex.test(custom.accent)) {
            var lin = function (i) {
              var c = parseInt(custom.accent.substr(i, 2), 16) / 255;
              return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
            };
            var bg = 0.2126 * lin(1) + 0.7152 * lin(3) + 0.0722 * lin(5) + 0.05;
            var navy = 0.0059 + 0.05; // luminance of #0b1220, plus the 0.05 offset
            root.style.setProperty('--accent-contrast', bg / navy >= 1.05 / bg ? '#0b1220' : '#ffffff');
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: a slow font host must never hold up first paint. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>

        href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet"
      />

         written into the marker below at build time from scripts/static-content.html (see scripts/generate-seo.mjs). -->
    <noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
